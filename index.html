<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dr. Aditi Sengupta | IEM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .profile-card img {
            width: 240px;
            height: 240px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            margin: 22px 0 8px;
            font-size: 30px;
            color: #172033;
        }

        .designation {
            font-size: 20px;
            font-weight: bold;
            color: #f0a000;
            margin-bottom: 8px;
        }

        .qualification {
            font-size: 18px;
            color: #444;
            font-style: italic;
            margin-bottom: 20px;
        }

        .department {
            font-size: 17px;
            line-height: 1.7;
            color: #26344d;
            margin-top: 10px;
        }

        .contact {
            margin-top: 20px;
            font-size: 17px;
            line-height: 1.9;
        }

        .contact a {
            color: #19366d;
            text-decoration: none;
            font-weight: bold;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 22px;
            background: #19366d;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .button:hover {
            background: #10264f;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img src="aditi-sengupta.jpg"
             alt="Dr. Aditi Sengupta">

        <h1>Dr. Aditi Sengupta</h1>

        <div class="designation">
            ASSOCIATE PROFESSOR
        </div>

        <div class="qualification">
            PhD, M.Tech, B.Tech
        </div>

        <div class="department">
            <strong>Dept. of CST-CSIT</strong><br>
            Institute of Engineering and Management<br>
            University of Engineering and Management, Kolkata, India
        </div>

        <div class="contact">
            📞 <a href="tel:9126301101">9126301101</a><br>

            ✉️ <a href="mailto:aditi.sengupta@iem.edu.in">
                aditi.sengupta@iem.edu.in
            </a>
        </div>

        <a
            class="button"
            href="https://faculty.iem.edu.in/faculty/347"
            target="_blank">
            View Official Faculty Profile
        </a>

    </div>

</body>
</html>
